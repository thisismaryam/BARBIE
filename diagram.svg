<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Me -->
  <rect x="30" y="120" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#333"/>
  <text x="100" y="150" text-anchor="middle" font-weight="bold">Me</text>
  <text x="100" y="170" text-anchor="middle" font-size="12">(terminal)</text>

  <!-- BARBIE -->
  <rect x="290" y="120" width="140" height="70" rx="8" fill="#fce8e6" stroke="#333"/>
  <text x="360" y="150" text-anchor="middle" font-weight="bold">BARBIE</text>
  <text x="360" y="170" text-anchor="middle" font-size="12">friday.py</text>

  <!-- To-do list -->
  <rect x="550" y="120" width="140" height="70" rx="8" fill="#e6f4ea" stroke="#333"/>
  <text x="620" y="150" text-anchor="middle" font-weight="bold">To-do list</text>
  <text x="620" y="170" text-anchor="middle" font-size="12">tasks[]</text>

  <!-- Me -> BARBIE: commands -->
  <line x1="170" y1="145" x2="288" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="229" y="138" text-anchor="middle" font-size="11">commands</text>
  <text x="229" y="160" text-anchor="middle" font-size="11">(add/list/done/chat/quit)</text>

  <!-- BARBIE -> Me: replies -->
  <line x1="288" y1="170" x2="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="229" y="190" text-anchor="middle" font-size="11">replies / errors</text>

  <!-- BARBIE -> To-do: read/write -->
  <line x1="430" y1="145" x2="548" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="138" text-anchor="middle" font-size="11">add / mark done</text>

  <!-- To-do -> BARBIE: list -->
  <line x1="548" y1="170" x2="430" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="489" y="190" text-anchor="middle" font-size="11">list back</text>

  <!-- Chat call note -->
  <rect x="290" y="30" width="140" height="50" rx="8" fill="#fff7e0" stroke="#333"/>
  <text x="360" y="50" text-anchor="middle" font-weight="bold" font-size="12">Free model API</text>
  <text x="360" y="68" text-anchor="middle" font-size="11">(key from env var)</text>
  <line x1="360" y1="80" x2="360" y2="118" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="103" text-anchor="middle" font-size="11">chat turn</text>

  <text x="360" y="300" text-anchor="middle" font-size="11" fill="#666">Me ⇄ BARBIE ⇄ to-do list; BARBIE also calls a free model for chat.</text>
</svg>