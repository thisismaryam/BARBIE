name: tests
on:
  push:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install pytest requests
      - name: Run tests (no network)
        run: python -m pytest friday.py
