name: tests
on:
  push:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install pytest requests
      - name: Run tests (no network)
        run: python -m pytest friday.py
      - name: Secret scan (every commit)
        run: |
          if git log -p --all | grep -Ei "(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|api[_-]?key\s*=\s*['\"][^'\"]{16,})"; then
            echo "::error::Possible secret in history"; exit 1
          fi
          echo "No secrets found in history."